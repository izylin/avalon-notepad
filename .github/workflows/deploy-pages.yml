name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "course/**"
      - "docs/**"
      - "pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          cp pages/index.html _site/index.html

          mkdir -p _site/course
          cp -r course/* _site/course/

          mkdir -p _site/docs
          cp -r docs/* _site/docs/
          cp pages/docsify-index.html _site/docs/index.html
          cp pages/docsify-sidebar.md _site/docs/_sidebar.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
