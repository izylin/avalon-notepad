<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Avalon Notepad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FAF7F2;
      --text: #2C2A28;
      --text-secondary: #6B6560;
      --border: #E5DFD6;
      --accent: #D94F30;
      --surface: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #201E1B;
        --text: #F2EEE7;
        --text-secondary: #B8B0A6;
        --border: #3A3733;
        --surface: #2A2724;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 640px; width: 100%; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p.sub { color: var(--text-secondary); margin: 0 0 32px; }
    .cards { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
    a.card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    a.card .icon { font-size: 1.75rem; }
    a.card h2 { font-size: 1.05rem; margin: 12px 0 6px; }
    a.card p { font-size: 0.9rem; color: var(--text-secondary); margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Avalon Notepad</h1>
    <p class="sub">阿瓦隆桌游的记分助手 — 选择你想看的内容</p>
    <div class="cards">
      <a class="card" href="course/">
        <div class="icon">🧩</div>
        <h2>代码原理课程</h2>
        <p>交互式讲解这个 App 内部是怎么运作的，支持中英文切换。</p>
      </a>
      <a class="card" href="docs/">
        <div class="icon">🚀</div>
        <h2>从代码到上线</h2>
        <p>教你如何 fork、本地开发、部署到 Vercel，以及排查部署问题。</p>
      </a>
    </div>
  </div>
</body>
</html>
